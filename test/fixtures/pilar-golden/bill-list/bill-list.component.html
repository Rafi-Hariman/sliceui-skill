<!-- Generated by SliceUI -->
<div class="content">
  <h1 class="h1">Daftar Tagihan</h1>
  <hr />

  <div class="row">
    <div class="col-md-3">
      <label class="control-label">Jenis tagihan</label>
      <ngx-select [items]="[]" [(ngModel)]="selectedType" (select)="onSearch()" placeholder="Pilih jenis tagihan"></ngx-select>
    </div>
    <div class="col-md-3 search-col">
      <button class="btn btn-primary btn-block" (click)="onSearch()">Cari</button>
    </div>
  </div>

  <uii-table-skeleton *ngIf="false"></uii-table-skeleton>

  <uii-table
    [rows]="rows"
    [columns]="columns"
    [checkboxColumn]="true"
    [actionColumn]="true"
    [actionTitle]="'Aksi'"
    [searchOptions]="true"
    [limitOptions]="true"
    [paginationOptions]="true"
    (editClicked)="onEdit($event)"
    (detailClicked)="onDetail($event)"
  ></uii-table>
</div>
