<uii-table
  [rows]="rows"
  [columns]="columns"
  [actionTitle]="'Action'"
  [allowRightClick]="true"
  (detailClicked)="onDetailClicked($event)"
  (editClicked)="onEditClicked($event)"
  (printClicked)="onPrintClicked($event)"
  (deleteClicked)="onDeleteClicked($event)"
  (switchChanged)="onSwitchClicked($event)"
  (publishClicked)="onPublishClicked($event)"
  (validateClicked)="onValidateClicked($event)"
  (exportClicked)="onExportClicked($event)"
  (importClicked)="onImportClicked($event)"
  (rightClickAction)="onRightClicked($event)"
  ></uii-table>

  Action clicked : {{ actionSelected }}<br>
  Row selected : {{ rowSelected | json }}<br>
